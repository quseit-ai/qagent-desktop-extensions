name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      qdu_url:
        description: Public HTTPS URL of the QDU produced by qagent-webui
        required: true
        type: string
      brand_id:
        description: Stable brand identity from brand.yaml (for example qagent or eduai)
        required: true
        type: string
      sha256:
        description: SHA-256 of the complete QDU file
        required: true
        type: string
      size:
        description: QDU size in bytes
        required: true
        type: string
      version_code:
        description: Monotonically increasing desktop version code
        required: true
        type: string
      version:
        description: Human-readable version
        required: false
        type: string

concurrency:
  group: qde-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate inputs and write temporary source
        env:
          QDU_URL: ${{ inputs.qdu_url }}
          QDU_SHA256: ${{ inputs.sha256 }}
          QDU_SIZE: ${{ inputs.size }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version }}
          BRAND_ID: ${{ inputs.brand_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const versionCode = Number(process.env.VERSION_CODE);
          const size = Number(process.env.QDU_SIZE);
          const brandId = process.env.BRAND_ID;
          if (!Number.isInteger(versionCode) || versionCode < 1) throw new Error('invalid version_code');
          if (!Number.isInteger(size) || size < 1) throw new Error('invalid size');
          if (!/^https:\/\//.test(process.env.QDU_URL || '')) throw new Error('qdu_url must use HTTPS');
          if (!/^[a-f0-9]{64}$/.test(process.env.QDU_SHA256 || '')) throw new Error('invalid sha256');
          if (!/^[a-z0-9][a-z0-9-]{0,63}$/.test(brandId || '')) throw new Error('invalid brand_id');
          const dir = `desktop/${brandId}/stable/windows-x64`;
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'source.json'), JSON.stringify({
            versionCode,
            version: process.env.VERSION_NAME || null,
            brandId,
            channel: 'stable',
            platform: 'win32',
            arch: 'x64',
            fileName: `${brandId}-desktop-${versionCode}.qdu`,
            releaseUrl: process.env.QDU_URL,
            size,
            sha256: process.env.QDU_SHA256,
          }, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_ENV, `SOURCE_PATH=${dir}/source.json\n`);
          NODE

      - name: Download and validate QDU
        run: node scripts/stage-desktop-update.mjs "$SOURCE_PATH" release-stage

      - name: Publish persistent GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ inputs.version_code }}
          BRAND_ID: ${{ inputs.brand_id }}
        run: |
          tag="${BRAND_ID}-desktop-v${VERSION_CODE}"
          file="release-stage/desktop/${BRAND_ID}/stable/windows-x64/releases/${VERSION_CODE}/${BRAND_ID}-desktop-${VERSION_CODE}.qdu"
          gh release create "$tag" "$file" --title "${BRAND_ID} Desktop v${VERSION_CODE}" --notes "${BRAND_ID} Desktop QDU update payload." --latest=false

      - name: Persist release source manifest
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          REPOSITORY: ${{ github.repository }}
          BRAND_ID: ${{ inputs.brand_id }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = process.env.SOURCE_PATH;
          const source = JSON.parse(fs.readFileSync(file, 'utf8'));
          source.releaseUrl = `https://github.com/${process.env.REPOSITORY}/releases/download/${process.env.BRAND_ID}-desktop-v${process.env.VERSION_CODE}/${source.fileName}`;
          fs.writeFileSync(file, JSON.stringify(source, null, 2) + '\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SOURCE_PATH"
          git commit -m "release(${BRAND_ID}): publish desktop QDU v${VERSION_CODE}"
          git push

      - name: Generate extension registry
        env:
          HERMES_EXTENSION_REGISTRY_BASE_URL: https://qde.quseit.com/
        run: node scripts/generate-registry.mjs --out dist/registry.json

      - name: Stage desktop update for Pages
        run: node scripts/stage-desktop-update.mjs --all dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy qde.quseit.com
        id: deployment
        uses: actions/deploy-pages@v5
